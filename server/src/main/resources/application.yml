# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890ThanhDo200904bb1jrunfdl}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

  # CORS Configuration
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${CORS_HEADERS:*}

  # License Configuration
#  license:
#    max-usage-per-key: ${LICENSE_MAX_USAGE:1000}
#    default-expiry-days: ${LICENSE_EXPIRY_DAYS:365}

  # AI Integration (Future)
