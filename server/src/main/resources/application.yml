spring:
  application:
    name : server
  datasource:
    url : jdbc:mysql://localhost:3306/edutest-gen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto : update # or create, create-drop, none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
#        format_sql: true
#        use_sql_comments: true
#        connection:
#          useUnicode: true
#          characterEncoding: utf8mb4
#          charSet: utf8mb4
#        create_empty_composites: true
#        globally_quoted_identifiers: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

    # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-stacktrace: on_param
    include-message: always

