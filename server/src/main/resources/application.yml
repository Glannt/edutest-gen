#    api-key: ${AI_API_KEY:}
#    timeout: ${AI_TIMEOUT:30000}

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
#    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

