version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: edutest_mysql
    restart: always
    environment:
      MYSQL_DATABASE: edutest-gen
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: edutest_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: glannt
      MONGO_INITDB_ROOT_PASSWORD: Glannt_0904
      MONGO_INITDB_DATABASE: edutest-gen
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edutest_server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/edutest-gen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATA_MONGODB_URI=mongodb://glannt:Glannt_0904@mongodb:27017/edutest-gen?authSource=admin
      - SERVER_PORT=8080
      - JWT_SECRET=mySecretKey123456789012345678901234567890ThanhDo200904bb1jrunfdl
      - JWT_EXPIRATION=86400000
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: edutest_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mysql_data:
  mongo_data:
